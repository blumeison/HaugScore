# fly.toml — HaugScore deployment config
# App name must be globally unique on fly.io. Adjust if "haugscore" is taken.
app = "haugscore"
primary_region = "fra"  # Frankfurt — closest to Austria/Czech Republic

[build]

[env]
  DATA_DIR = "/data"
  NODE_ENV = "production"
  PORT = "3001"

# Persistent volume for data.json + archive/ — survives redeploys
[[mounts]]
  source = "haugscore_data"
  destination = "/data"

[http_service]
  internal_port = 3001
  force_https = true
  # Suspend (not stop) when idle: fast resume (~1s), keeps machine state
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  # Socket.io needs websocket upgrades
  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/state"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
